<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cartelera: administra tu lista de URLs y marca su verificación.">
  <meta name="theme-color" content="#0b0b0f">
  <title>Cartelera · Lista de URLs</title>
  <link rel="icon" type="image/png" href="cartelera.png">
  <link rel="apple-touch-icon" href="cartelera.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login-view" class="login-view" aria-label="Inicio de sesión">
    <form id="login-form" class="login-card" novalidate>
      <img class="login-logo" src="cartelera.png" alt="Cartelera" width="112" height="112">
      <h1 class="login-title">Cartelera</h1>
      <p class="login-subtitle">Acceso a la lista de URLs</p>

      <div class="field">
        <label for="login-user">Usuario</label>
        <input id="login-user" name="user" type="text" autocomplete="username" spellcheck="false" required autofocus>
      </div>

      <div class="field">
        <label for="login-pass">Clave</label>
        <div class="password-field">
          <input id="login-pass" name="pass" type="password" autocomplete="current-password" required>
          <button type="button" id="toggle-pass" class="icon-btn toggle-pass" aria-label="Mostrar clave" aria-pressed="false">
            <svg id="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M3 3l18 18"></path>
              <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"></path>
              <path d="M6.4 6.5A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10.6 10.6 0 0 0 5.1-1.3"></path>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
            </svg>
          </button>
        </div>
      </div>

      <p id="login-error" class="login-error" role="alert" hidden>Usuario o clave incorrectos.</p>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
  </section>

  <div id="app-view" class="app" hidden>
    <header class="app-header">
      <div class="app-header-inner">
        <div class="brand">
          <img class="brand-logo" src="cartelera.png" alt="Cartelera" width="36" height="36">
          <span class="brand-name">Cartelera</span>
        </div>
        <button type="button" id="logout-btn" class="btn btn-ghost btn-sm">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="M16 17l5-5-5-5"></path>
            <path d="M21 12H9"></path>
          </svg>
          Salir
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="page-head">
        <h1>Lista de URLs</h1>
        <p>Agrega enlaces, modifícalos o elimínalos, y marca su verificación.</p>
      </div>

      <section id="form-panel" class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Agregar URL</h2>
        <form id="item-form" class="item-form" novalidate>
          <div class="field">
            <label for="url-input">URL</label>
            <input id="url-input" name="url" type="text" inputmode="url" placeholder="https://ejemplo.com" autocomplete="off" spellcheck="false">
          </div>

          <div class="field">
            <label for="desc-input">Descripción</label>
            <input id="desc-input" name="description" type="text" placeholder="Describe el enlace" maxlength="160" autocomplete="off">
          </div>

          <div class="field">
            <span class="field-label" id="status-label">Verificación</span>
            <div class="segmented" role="radiogroup" aria-labelledby="status-label">
              <label class="segment">
                <input type="radio" name="status" value="no-vista" checked>
                <span>No vista</span>
              </label>
              <label class="segment">
                <input type="radio" name="status" value="vista">
                <span>Vista</span>
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" id="cancel-edit-btn" class="btn btn-ghost" hidden>Cancelar</button>
            <button type="submit" id="submit-btn" class="btn btn-primary">Agregar</button>
          </div>
          <p id="form-error" class="form-error" role="alert" hidden></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <div class="list-head">
          <h2 id="list-title">URLs guardadas</h2>
          <span id="stats" class="stats" hidden></span>
        </div>
        <p id="empty-state" class="empty-state">Aún no hay URLs en la lista. Agrega la primera arriba.</p>
        <ul id="items-list" class="items-list"></ul>
      </section>
    </main>
  </div>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Eliminar URL</h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">Cancelar</button>
        <button value="confirm" class="btn btn-danger">Eliminar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
